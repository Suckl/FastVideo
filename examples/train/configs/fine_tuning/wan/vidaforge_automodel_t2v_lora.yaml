# Wan 2.1 T2V 1.3B LoRA fine-tuning from a VidaForge AutoModel cache.
#
# The cache's exact VAE and text-encoder fingerprints are intentionally passed
# as CLI overrides. See docs/training/data_preprocess.md for the launch command.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    lora:
      enable: true
      rank: 16
      alpha: 32
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  dit_precision: bf16

  distributed:
    num_gpus: 1
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1

  data:
    data_path: data/vidaforge-stage5
    preprocessed_data_type: vidaforge_automodel
    vidaforge_model_name: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    vidaforge_vae_fingerprint: ""
    vidaforge_text_encoder_fingerprint: ""
    vidaforge_allow_unverified_model: false
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    # VidaForge cache batches carry their own bucket geometry. These values
    # remain nominal training defaults and do not crop cached latents.
    num_latent_t: 20
    num_height: 480
    num_width: 832
    num_frames: 77

  optimizer:
    learning_rate: 1.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan_vidaforge_lora
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    project_name: fastvideo
    run_name: wan_vidaforge_lora

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 3
